name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Headless Tests (${{ matrix.os }}, ${{ matrix.neovim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            neovim: v0.11.0
          - os: ubuntu-latest
            neovim: v0.12.0
          - os: macos-latest
            neovim: v0.11.0
          - os: macos-latest
            neovim: v0.12.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Show tool versions
        run: |
          nvim --version | head -n 1
          python3 --version

      - name: Run test suite
        run: nvim --headless -u NONE -c "lua dofile('scripts/run_tests.lua')"
