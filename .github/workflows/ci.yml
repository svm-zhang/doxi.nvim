name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Headless Tests (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim:
          - v0.10.4
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Show tool versions
        run: |
          nvim --version | head -n 1
          python3 --version

      - name: Run test suite
        run: nvim --headless -u NONE -c "lua dofile('scripts/run_tests.lua')"
